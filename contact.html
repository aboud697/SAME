<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact – SAME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="contact-page">
<header class="contact-header">
  <a class="contact-logo" href="index.html" aria-label="SAME, accueil">SAME</a>
  <a href="index.html">Retour au site</a>
</header>

<main class="contact-main">
  <h1>Contact</h1>
  <form class="contact-form" action="https://formsubmit.co/yshem81@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="Nouveau message depuis SAME">
    <label class="contact-honey" aria-hidden="true">Ne pas remplir
      <input type="text" name="_honey" tabindex="-1" autocomplete="off">
    </label>
    <label for="contact-name">Nom
      <input id="contact-name" name="name" type="text" autocomplete="name" required>
    </label>
    <label for="contact-email">E-mail
      <input id="contact-email" name="email" type="email" autocomplete="email" required>
    </label>
    <label for="contact-message">Message
      <textarea id="contact-message" name="message" required></textarea>
    </label>
    <button class="btn" type="submit">Envoyer</button>
  </form>
</main>

<footer><small>© 2026 SAME</small></footer>
</body>
</html>
